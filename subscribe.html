<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening ExamSimplify...</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9;
    }

    .container {
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f1f5f9;
    }

    .logo span {
      color: #6366f1;
    }

    .spinner {
      width: 52px;
      height: 52px;
      border: 4px solid #1e293b;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      font-size: 1.1rem;
      color: #94a3b8;
    }

    .sub-message {
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Exam<span>Simplify</span></div>
    <div class="spinner"></div>
    <p class="message">Opening ExamSimplify...</p>
    <p class="sub-message" id="sub">Taking you to your plan</p>
  </div>

  <script>
    (function () {
      var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.examsimplify.app";
      var HOMEPAGE = "/";
      var TIMEOUT_MS = 2000;

      var params = new URLSearchParams(window.location.search);
      var plan = params.get("plan");

      if (!plan) {
        window.location.replace(HOMEPAGE);
        return;
      }

      var deepLink = "https://examsimplify.com/subscribe?plan=" + encodeURIComponent(plan);

      // Build Android intent URL as the primary trigger
      var intentUrl =
        "intent://examsimplify.com/subscribe?plan=" + encodeURIComponent(plan) +
        "#Intent" +
        ";scheme=https" +
        ";package=com.examsimplify.app" +
        ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE_URL) +
        ";end";

      var isAndroid = /android/i.test(navigator.userAgent);

      // After timeout, send user to Play Store if the page is still visible
      var fallbackTimer = setTimeout(function () {
        window.location.replace(PLAY_STORE_URL);
      }, TIMEOUT_MS);

      // Cancel fallback if the page loses focus (app opened successfully)
      window.addEventListener("blur", function () {
        clearTimeout(fallbackTimer);
      });

      // Also cancel if visibility changes (e.g. app launched in same task)
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          clearTimeout(fallbackTimer);
        }
      });

      if (isAndroid) {
        // Use intent:// URL — Android handles fallback_url natively
        window.location.href = intentUrl;
      } else {
        // Non-Android: try the HTTPS deep link; fall back to Play Store via timeout
        window.location.href = deepLink;
      }
    })();
  </script>
</body>
</html>
